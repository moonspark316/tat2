name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in what you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a pad …
        2. Type …
        3. See …
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS & version
      placeholder: "macOS 14.5 / Windows 11 / Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Tat2 version
      description: Shown on the release you installed (e.g. v1.0.0), or "built from source @ <commit>".
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, or notes. (Never paste private note contents you don't want public.)
