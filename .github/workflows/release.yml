name: Release

# On a v* tag, build native bundles for every desktop OS on GitHub-hosted
# runners (free for public repos) and upload them to the GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Build & upload (${{ matrix.label }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Universal)
            os: macos-latest
            args: "--target universal-apple-darwin"
            rustup-target: "aarch64-apple-darwin,x86_64-apple-darwin"
          - label: Windows
            os: windows-latest
            args: ""
            rustup-target: ""
          - label: Linux
            os: ubuntu-latest
            args: ""
            rustup-target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustup-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sign the auto-update artifacts (minisign). tauri-action generates +
          # uploads `latest.json` to the release automatically when these are set
          # and `bundle.createUpdaterArtifacts` is true in tauri.conf.json.
          # Add these as repo secrets (see README "Auto-update"); without them
          # the build still succeeds but produces no signed update manifest.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
