name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on the self-hosted obx2 runners (Linux) — no GitHub-hosted minutes.
  check:
    name: Typecheck + cargo check
    runs-on: [self-hosted, obx2]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm typecheck

      - name: Rust format check
        run: |
          rustup component add rustfmt >/dev/null 2>&1 || true
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  build-linux:
    name: Build (Linux, obx2)
    needs: check
    runs-on: [self-hosted, obx2]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Build app (.deb + AppImage)
        run: pnpm tauri build

  # macOS/Windows bundles need GitHub-hosted runners. Trigger manually
  # (workflow_dispatch) once Actions billing is enabled.
  build-hosted:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build app
        run: pnpm tauri build
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tat2-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: ignore
